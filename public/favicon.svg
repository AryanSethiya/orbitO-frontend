<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08140a" />
      <stop offset="100%" stop-color="#020403" />
    </radialGradient>

    <!-- Glowing Green Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#48ff48" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#48ff48" stroke-width="2" stroke-opacity="0.85" />

  <!-- Radar Calibration Ticks -->
  <line x1="32" y1="2" x2="32" y2="7" stroke="#48ff48" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="57" x2="32" y2="62" stroke="#48ff48" stroke-width="1.5" stroke-linecap="round" />
  <line x1="2" y1="32" x2="7" y2="32" stroke="#48ff48" stroke-width="1.5" stroke-linecap="round" />
  <line x1="57" y1="32" x2="62" y2="32" stroke="#48ff48" stroke-width="1.5" stroke-linecap="round" />

  <!-- Back Half of Tilted Orbit Ring (passes behind the 'O') -->
  <path d="M12 39 C 14 26, 42 17, 52 23" stroke="#48ff48" stroke-width="2" stroke-dasharray="3 2" stroke-opacity="0.5" />

  <!-- The Bold Central 'O' -->
  <!-- Outer O contour -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#ffffff" stroke-width="4.5" filter="url(#neonGlow)" />
  <!-- Inner O glow ring -->
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#48ff48" stroke-width="1.5" stroke-opacity="0.9" />

  <!-- Center Telemetry Target Dot -->
  <circle cx="32" cy="32" r="3" fill="#48ff48" />
  <circle cx="32" cy="32" r="1.2" fill="#ffffff" />

  <!-- Front Half of Tilted Planetary Orbit Ring (sweeps in front of the 'O') -->
  <path d="M52 23 C 54 36, 22 47, 12 39" stroke="url(#orbitGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Orbiting Telemetry Probe (The Satellite Dot) -->
  <circle cx="47" cy="33" r="3.2" fill="#ffffff" stroke="#48ff48" stroke-width="1.5" />
  <circle cx="47" cy="33" r="1.2" fill="#48ff48" />
</svg>